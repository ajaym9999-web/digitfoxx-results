name: Daily UK49s Results Update - DigitFoxx.com

on:
  schedule:
    # Brunchtime 10:49 AM UK = 11:20 AM UK run
    - cron: '20 10 * * *'
    - cron: '20 11 * * *'
    # Lunchtime 12:49 PM UK = 1:20 PM UK run
    - cron: '20 12 * * *'
    - cron: '20 13 * * *'
    # Drivetime 3:49 PM UK = 4:20 PM UK run
    - cron: '20 15 * * *'
    - cron: '20 16 * * *'
    # Teatime 5:49 PM UK = 6:20 PM UK run (sabse important)
    - cron: '20 17 * * *'
    - cron: '20 18 * * *'

  workflow_dispatch:

jobs:
  update-results:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml

      - name: Run UK49s scraper
        run: |
          python scraper.py

      - name: Check if results.json changed
        id: check_changes
        run: |
          if [[ -n $(git status --porcelain results.json) ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --global user.name 'DigitFoxx Bot'
          git config --global user.email 'bot@digitfoxx.com'
          git add results.json
          git commit -m "Auto update - $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
