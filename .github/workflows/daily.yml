name: Daily UK49s Results Update - DigitFoxx.com

on:
  schedule:
    # Har 30 min pe - SAME AS WORKING uk49.vedicvibe.online
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  update-results:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests beautifulsoup4

      - name: Run scraper (za.national-lottery.com FIRST - same as uk49 bot)
        run: python scraper.py

      - name: Commit and push results.json
        run: |
          git config user.name "DigitFoxx Bot"
          git config user.email "bot@digitfoxx.com"
          git add results.json
          git diff --staged --quiet || git commit -m "Auto update UK49s results $(date -u +'%Y-%m-%d %H:%M UTC') - from za.national-lottery.com"
          git push

      - name: Trigger Pages rebuild
        run: |
          echo "Results updated at $(date)"
