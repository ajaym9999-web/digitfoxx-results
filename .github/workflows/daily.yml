name: Daily UK49s Results Update

on:
  schedule:
    - cron: '15 13 * * *'  # 1:15 PM UTC = 2:15 PM UK (Lunchtime)
    - cron: '15 18 * * *'  # 6:15 PM UTC = 7:15 PM UK (Teatime + buffer)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4
      
      - name: Run scraper
        run: python scraper.py
      
      - name: Commit and push if changed
        run: |
          git config --global user.name 'DigitFoxx Bot'
          git config --global user.email 'bot@digitfoxx.com'
          git add results.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update UK49s - $(date -u +'%Y-%m-%d %H:%M UTC')" && git push)
